## Meta service start-up url
## K8s meta service cluster master-standby high availability scenario: ClusterIP address
## Non-HA scenario: keep consistent with the same name configuration in mmc-meta.conf
ock.mmc.meta_service_url = tcp://127.0.0.1:5000

## Config store url, it will automatically modified to PodIP at Pod startup in HA scenario
## Keep consistent with the same name configuration in mmc-meta.conf
ock.mmc.local_service.config_store_url = tcp://127.0.0.1:6000

## Log level: debug, info, warn, error
ock.mmc.log_level = info

## Max rank count; once ranks connect, no further changes allowed (meta restart required)
## 4-rank TP=4: 2 die-pairs (dev4,5 + dev6,7), world_size=4
ock.mmc.local_service.world_size = 4

## Data transfer protocol options:
## Pure-DRAM test uses host_shm (DRAM-only, 无 HBM):
##   4 rank 共享 /dev/shm DRAM，所有 KV Cache 直接落 DRAM
##   不走 HBM，不触发 HBM→DRAM eviction
##   /dev/shm 需 resize 到 >= 50GB (4 rank × 10GB = 40GB + headroom)
##
## KV Cache structure (DeepSeek R1 W8A8):
##   61 layers, K=128KB, V=16KB, block_size=128, seq_len=4096
##   → 281MB per request per rank
##   DRAM 10GB / 281MB ≈ 36 requests per rank (无 HBM 快速路径)
##
## device_sdma (HBM + DRAM 混合存储) — 见 mmc-local-largecap-4rank.conf:
##   ock.mmc.local_service.protocol = device_sdma
##   ock.mmc.local_service.hbm.size = 3GB
##   ock.mmc.local_service.dram.size = 10GB
ock.mmc.local_service.protocol = host_shm

## DRAM space usage
ock.mmc.local_service.dram.size = 10GB
ock.mmc.local_service.hbm.size = 0
