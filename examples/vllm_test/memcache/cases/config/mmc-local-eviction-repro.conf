## Meta service start-up url
ock.mmc.meta_service_url = tcp://127.0.0.1:5000

## Config store url
ock.mmc.local_service.config_store_url = tcp://127.0.0.1:6000

## Log level: info (need INFO logs for SetThreadAclDevice / CopyData diagnostics)
ock.mmc.log_level = info

## 2-rank group
ock.mmc.local_service.world_size = 2

## device_sdma protocol (HBM + DRAM)
ock.mmc.local_service.protocol = device_sdma

## Small HBM to trigger eviction quickly
## With 2 ranks, total HBM = 512MB
## High watermark 90% = 460MB → ~2 keys (274.5MB each) to reach 90%+
ock.mmc.local_service.hbm.size = 256MB

## DRAM for eviction target
ock.mmc.local_service.dram.size = 512MB
