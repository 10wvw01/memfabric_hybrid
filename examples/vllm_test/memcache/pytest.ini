[pytest]
markers =
    throughput: throughput benchmark via ``vllm bench serve`` (deselect with -m "not throughput")
    rank2: 2-rank (TP=2) integration tests
    rank4: 4-rank (TP=4) integration tests
    workload: Layer 2 workload tests
    largecap: large-capacity Layer 2 tests
    hitdecode: partial prefix hit (2k) + long decode (1.5k) tests
